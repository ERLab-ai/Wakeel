name: Wakeel 2.0 baseline import safeguards
on:
  push:
    branches: [chore/v0213-baseline-import-p0]
  pull_request:
jobs:
  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p 'test_import_v0213.py' -v
      - run: python -m py_compile tools/import_v0213.py
      - name: Validate actual baseline if committed
        run: |
          if test -f baseline/v0.21.3/MANIFEST.sha256.json; then
            python -m pip install 'jsonschema>=4.18,<5' 'numpy==2.2.6'
            cd baseline/v0.21.3
            python tools/validate.py
            python tools/selftest.py
            python tools/build_atlas.py
            python tools/test_chapter8.py
            python tools/test_chapter9.py
          else
            echo "P0 importer tooling only; scientific source NOT committed"
          fi
